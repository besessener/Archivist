version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot resolves the next tag and rewrites the comment.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # Hook revisions in .pre-commit-config.yaml
  - package-ecosystem: 'pre-commit'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Electron and the native modules (better-sqlite3 & co.) must match each other and are never merged automatically.
      electron:
        patterns: ['electron', 'electron-builder', 'better-sqlite3', '@electron/*']
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next']
      dev-minor-patch:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
      prod-minor-patch:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
