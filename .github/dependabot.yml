version: 2
updates:
  # Actions sind auf Commit-SHAs gepinnt; Dependabot löst den nächsten Tag auf und schreibt den Kommentar um.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Hook-Revisionen in .pre-commit-config.yaml
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Electron und die nativen Module (better-sqlite3 & Co.) müssen zusammenpassen und werden nie automatisch gemergt.
      electron:
        patterns: ["electron", "electron-builder", "better-sqlite3", "@electron/*"]
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
      dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
