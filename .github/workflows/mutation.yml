name: Mutation test

env:
  NEXT_TELEMETRY_DISABLED: 1

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/src/util/paths.ts'
      - 'packages/core/src/util/redact.ts'
      - 'packages/core/src/services/privacy.ts'
      - 'packages/core/src/services/undo.ts'
      - 'packages/core/src/agent/gate.ts'
      - 'packages/core/src/agent/security.ts'
      - 'packages/core/src/agent/history-privacy.ts'
      - 'packages/core/src/services/rename-pattern.ts'
      - 'packages/core/src/services/decision-fields.ts'
      - 'packages/core/src/services/open-item-fields.ts'
      - 'packages/core/src/agent/tools/research/deadlines.ts'
      - 'packages/core/src/agent/tools/research/amounts.ts'
      - 'packages/core/src/services/contradiction-rules.ts'
      - 'packages/shared/src/llm-base-url.ts'
      - 'tests/**'
      - 'stryker.config.mjs'
      - 'mutation-targets.mjs'
      - 'vitest.mutation.config.mts'
      - 'package-lock.json'
  # Daily full run: incremental mode misses changes outside mutated and test files (imports, dependencies).
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions: {}

# Runs share the incremental baseline in the cache, so they must not overlap.
concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore incremental baseline
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-
      - name: Mutation test (fails below the threshold in stryker.config.mjs)
        env:
          EVENT_NAME: ${{ github.event_name }}
        # Push: only changed mutants and tests; schedule and manual runs: everything, as a fresh baseline.
        run: |
          if [ "$EVENT_NAME" = push ]; then
            npx stryker run --concurrency 4 --incremental
          else
            npx stryker run --concurrency 4 --incremental --force
          fi
      - name: Save incremental baseline
        if: ${{ !cancelled() && hashFiles('reports/stryker-incremental.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
      - name: Summary
        if: ${{ !cancelled() }}
        run: node scripts/mutation-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
