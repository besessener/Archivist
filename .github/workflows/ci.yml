name: CI

env:
  NEXT_TELEMETRY_DISABLED: 1

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan entire history for secrets
        run: gitleaks git --redact --verbose --no-banner .
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          # gitleaks runs over the whole history above; the hook itself only checks staged changes
          SKIP: gitleaks
          GH_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - name: Architecture boundaries (dependency-cruiser)
        run: npm run depcruise
      - name: Dead code and unused dependencies (Knip)
        run: npm run knip
      - run: npm run test:coverage
      - name: Coverage in the job summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct} % | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Test coverage", "", "| Metric | Coverage | Lines |", "|---|---|---|", ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - run: npm run native:check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/renderer/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/renderer/**/*.ts', 'apps/renderer/**/*.tsx') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - name: E2E (Electron under Xvfb)
        run: xvfb-run -a npx playwright test
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/renderer/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/renderer/**/*.ts', 'apps/renderer/**/*.tsx') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build Windows packages (signed if a certificate is configured)
        run: npm run dist:win
        env:
          # Secrets: WIN_CSC_LINK (Base64-encoded .pfx) and WIN_CSC_KEY_PASSWORD. If they are missing, the build stays unsigned.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify signature
        shell: pwsh
        env:
          EXPECT_SIGNED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          $bad = $false
          Get-ChildItem apps/desktop/release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($env:EXPECT_SIGNED -eq 'true' -and $sig.Status -ne 'Valid') { $bad = $true }
          }
          if ($bad) { throw 'At least one shipped file is not validly signed.' }
          if ($env:EXPECT_SIGNED -ne 'true') { Write-Host '::notice::No signing certificate configured – the packages are unsigned.' }
      # Only keep builds from main (PRs build the packages only to verify the packaging); see prune-windows-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: archivist-windows
          path: |
            apps/desktop/release/*.exe
          retention-days: 30

  prune-windows-artifacts:
    # Installer + portable version are large: until releases are published, the three newest builds are enough
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: windows-installer
    permissions:
      actions: write
    steps:
      - name: Keep only the three newest Windows packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/${REPO}/actions/artifacts?name=archivist-windows&per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | [.created_at, .id] | @tsv' \
            | sort -r | tail -n +4 | cut -f2 \
            | while read -r id; do
                gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}"
                echo "Deleted artifact ${id}"
              done
