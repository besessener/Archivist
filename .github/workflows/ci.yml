name: CI

env:
  NEXT_TELEMETRY_DISABLED: 1

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run native:check
      - uses: actions/cache@v5
        with:
          path: apps/renderer/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/renderer/**/*.ts', 'apps/renderer/**/*.tsx') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - name: E2E (Electron unter Xvfb)
        run: xvfb-run -a npx playwright test

  windows-installer:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: apps/renderer/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/renderer/**/*.ts', 'apps/renderer/**/*.tsx') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run dist:win
      - uses: actions/upload-artifact@v6
        with:
          name: archivist-windows
          path: |
            apps/desktop/release/*.exe
