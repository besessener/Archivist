name: Release

env:
  NEXT_TELEMETRY_DISABLED: 1

# Publishes the installer and portable EXE as a GitHub Release (a draft until every file is uploaded) when a version tag (v1.2.3) is pushed.
# Merges to main and pull requests still only build the packages (see ci.yml).
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check tag against version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs "$TAG"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  publish:
    runs-on: windows-latest
    needs: verify
    permissions:
      # Create the release and upload files
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deliberately without npm/Next cache: a release is always built from scratch
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # Parallel uploads would each create a missing release; a draft also stays invisible to installed apps until latest.yml is up.
      - name: Create the GitHub Release up front as a draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes "${flags[@]}"
      - name: Build, sign and upload to the draft release
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tags with a suffix (v1.2.3-beta.1) appear as a pre-release
          EP_PRE_RELEASE: ${{ contains(github.ref_name, '-') }}
          # Secrets: WIN_CSC_LINK (Base64-encoded .pfx) and WIN_CSC_KEY_PASSWORD. If they are missing, the build stays unsigned.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Publish the GitHub Release once every file is uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
