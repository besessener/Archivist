# Packaging-Konfiguration für Archivist (electron-builder)
# Reverse-DNS-ID einer Domain, die uns gehört (besessener.github.io). Nicht mehr ändern: NSIS leitet daraus die
# Installer-GUID ab (stille Updates) und setzt sie als AppUserModelID der Verknüpfungen (Benachrichtigungen);
# muss mit APP_ID in src/app-id.ts übereinstimmen.
appId: io.github.besessener.archivist
productName: Archivist
copyright: Copyright © 2026 Matthias Eggert
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
# Native Module müssen außerhalb des ASAR-Archivs liegen, damit sie geladen werden können.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/@napi-rs/**'
  - '**/node_modules/tesseract.js/**'
  - '**/node_modules/tesseract.js-core/**'
  - '**/node_modules/@tesseract.js-data/**'
# Archivist wird nur für Windows gepackt. better-sqlite3 (>= 13) und sharp liefern N-API-Prebuilds → kein Rebuild nötig
# (die Ressourcen-Bearbeitung/Signierung der .exe braucht trotzdem Windows oder Wine, daher baut die CI auf windows-latest).
npmRebuild: false
nodeGypRebuild: false
electronLanguages:
  - de
  - en-US
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  # Authenticode-Signatur: electron-builder signiert automatisch, sobald ein Zertifikat per Umgebungsvariable vorliegt
  # (CSC_LINK = Pfad/Base64 der .pfx-Datei, CSC_KEY_PASSWORD = Kennwort; alternativ WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD).
  # Ohne Zertifikat entstehen unsignierte Builds (lokale Entwicklung, Pull Requests aus Forks).
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  artifactName: Archivist-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: Archivist-${version}-portable.${ext}
