# Packaging configuration for Archivist (electron-builder)
# Reverse-DNS ID of a domain we own (besessener.github.io). Do not change it anymore: NSIS derives the installer
# GUID from it (silent updates) and sets it as the AppUserModelID of the shortcuts (notifications);
# must match APP_ID in src/app-id.ts.
appId: io.github.besessener.archivist
productName: Archivist
copyright: Copyright © 2026 Matthias Eggert
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  # Only the Windows x64 binaries of onnxruntime-node (speech input) are needed; the web runtime is not used in Node.
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  - '!**/node_modules/onnxruntime-web/**'
asar: true
# Native modules must live outside the ASAR archive so that they can be loaded.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/@napi-rs/**'
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/tesseract.js/**'
  - '**/node_modules/tesseract.js-core/**'
  - '**/node_modules/@tesseract.js-data/**'
# Fuses are flipped at packaging time (no ELECTRON_RUN_AS_NODE, NODE_OPTIONS or --inspect in an installed app); the app is served via app://, not file://.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
# Archivist is only packaged for Windows. better-sqlite3 (>= 13) and sharp ship N-API prebuilds → no rebuild needed
# (editing resources/signing the .exe still requires Windows or Wine, so CI builds on windows-latest).
npmRebuild: false
nodeGypRebuild: false
# Publishing only via the release workflow (.github/workflows/release.yml, version tags v*): `npm run release:win`
# uploads the installer and portable EXE to a GitHub Release. Without electron-updater no update metadata (latest.yml) is uploaded.
publish:
  provider: github
  owner: besessener
  repo: Archivist
  releaseType: release
  publishAutoUpdate: false
electronLanguages:
  - de
  - en-US
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  # Authenticode signature: electron-builder signs automatically as soon as a certificate is provided via environment variable
  # (CSC_LINK = path/Base64 of the .pfx file, CSC_KEY_PASSWORD = password; alternatively WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD).
  # Without a certificate, unsigned builds are produced (local development, pull requests from forks).
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  artifactName: Archivist-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: Archivist-${version}-portable.${ext}
