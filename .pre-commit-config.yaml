# Locally: `prek install` (or `pre-commit install`). CI runs the same hooks with `prek run --all-files`.
# Hooks are pinned to commit SHAs; Dependabot (ecosystem pre-commit) updates them including the `# frozen:` comment.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: '(^|/)tsconfig.*\.json$|^packages/core/migrations/meta/'
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
        # intentionally contains a sample key block as test input for the redaction
        exclude: '^tests/unit/redact\.test\.ts$'
      - id: mixed-line-ending
        args: ['--fix=no']
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: d25b2b1dc80689fb633f21f6978bba69871181d3 # frozen: v1.31.0
    hooks:
      - id: zizmor
